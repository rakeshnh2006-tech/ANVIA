<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" fill="none">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879c8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Back leaf (large, pink-purple gradient) -->
  <path d="M 30 155 C 10 100 25 45 70 25 C 90 18 105 30 108 55 C 112 85 95 120 75 145 Z" fill="url(#leafGrad1)" opacity="0.85"/>

  <!-- Middle leaf (medium, purple) -->
  <path d="M 55 165 C 40 120 50 75 85 55 C 100 47 115 57 116 78 C 118 105 100 140 82 160 Z" fill="url(#leafGrad2)" opacity="0.9"/>

  <!-- Bottom swoosh leaf -->
  <path d="M 45 175 C 75 165 110 155 130 135 C 140 125 138 115 128 118 C 110 123 85 142 60 158 Z" fill="url(#leafGrad2)" opacity="0.85"/>

  <!-- Circular arc behind head -->
  <path d="M 68 30 C 55 18 52 8 65 5 C 80 2 95 12 100 28" stroke="url(#leafGrad1)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Face silhouette (profile facing right) -->
  <path d="
    M 88 35
    C 78 30 70 38 68 50
    C 65 65 70 78 78 85
    C 82 89 84 95 82 102
    C 79 112 76 118 78 125
    C 80 130 86 132 90 130
    C 92 129 94 127 95 124
    L 96 115
    C 97 108 100 103 103 100
    C 110 94 115 84 113 72
    C 111 58 102 38 88 35 Z
  " fill="url(#faceGrad)"/>

  <!-- Hair flowing back -->
  <path d="
    M 88 35
    C 95 28 108 25 118 32
    C 128 40 130 55 125 68
    C 120 78 112 82 108 88
    C 103 95 100 103 103 100
    C 110 94 115 84 113 72
    C 111 58 102 38 88 35 Z
  " fill="url(#hairGrad)"/>

  <!-- Hair detail lines -->
  <path d="M 95 38 C 108 32 122 38 126 52" stroke="#4c1d95" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 91 42 C 104 36 118 42 122 56" stroke="#4c1d95" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 78 85 C 74 88 74 93 78 95" stroke="#a78bfa" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- ANVIA wordmark -->
  <text x="148" y="130" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="2" fill="#4c1d95">ANVIA</text>

  <!-- Pink leaf dot on the i -->
  <ellipse cx="284" cy="52" rx="7" ry="10" fill="#f0abfc" transform="rotate(-15 284 52)"/>
  <ellipse cx="280" cy="46" rx="4" ry="6" fill="#e879c8" transform="rotate(-30 280 46)"/>

  <!-- Tagline -->
  <line x1="148" y1="148" x2="175" y2="148" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="180" y="153" font-family="Georgia, serif" font-size="16" fill="#7c3aed" letter-spacing="0.5">Your Health. Our Priority.</text>
  <line x1="388" y1="148" x2="415" y2="148" stroke="#c4b5fd" stroke-width="1.5"/>
</svg>
